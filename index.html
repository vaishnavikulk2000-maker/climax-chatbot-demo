<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climax Internal Support Assistant</title>

    <!-- Dialogflow Messenger Stylesheets & Scripts -->
    <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
    <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
    <!-- Include reCAPTCHA v3 library in the head. Replace YOUR_RECAPTCHA_SITE_KEY with your real site key. -->
    <style>
        body {
            font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            text-align: center;
            max-width: 850px;
            margin-bottom: 20px;
            border-bottom: 3px solid #003366; /* Climax Industrial Blue accent */
            padding-bottom: 15px;
            width: 100%;
        }

        h1 {
            color: #003366;
            margin: 0 0 8px 0;
            font-size: 26px;
        }

        p {
            color: #555;
            margin: 0;
            font-size: 15px;
        }

        /* Custom layout for central chat box with Climax styling flavor */
        df-messenger {
            position: relative !important;
            bottom: auto !important;
            right: auto !important;
            left: auto !important;
            top: auto !important;
            width: 100% !important;
            max-width: 850px !important;
            height: 650px !important;
            margin: 0 auto !important;
            display: block !important;
            box-shadow: 0 6px 20px rgba(0, 51, 102, 0.12);
            border-radius: 10px;
            z-index: 999;
            /* Theme overrides */
            --df-messenger-font-color: #1f1f1f;
            --df-messenger-font-family: 'Google Sans', sans-serif;
            --df-messenger-chat-background: #FFFFFF;
            --df-messenger-message-user-background: #003366;
            --df-messenger-message-user-font-color: #FFFFFF;
            --df-messenger-message-bot-background: #EAF0F6;
            --df-messenger-primary-color: #003366;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Climax Portable Machining</h1>
        <p>Internal Technical Support & Documentation Assistant</p>
    </div>

    <!-- Dialogflow Messenger Component with Quick Reply Buttons -->
    <df-messenger intent="WELCOME"
                  location="us-central1"
                  project-id="sfe-ai-chatbot"
                  agent-id="36161393-92f2-439e-91bf-20e7d469b325"
                  language-code="en"
                  max-query-length="-1"
                  allow-feedback="all">
        <df-messenger-chat chat-title="Climax Help"
                           chat-title-icon="https://storage.cloud.google.com/sfe-brands-docs/Screenshot 2026-06-15 143925.png">

            <!-- Pre-loaded suggestion chips (buttons) accompanying the greeting -->
            <df-messenger-message-chip>Contact customer support</df-messenger-message-chip>
            <df-messenger-message-chip>Know more about a product</df-messenger-message-chip>
            <df-messenger-message-chip>Troubleshooting guide</df-messenger-message-chip>

        </df-messenger-chat>
    </df-messenger>
    <!-- Replace the existing script tag and JS in index.html for local testing -->
    <!-- Use Google's test site key for local dev (safe). Replace when deploying. -->
    <script src="https://www.google.com/recaptcha/api.js?render=6Lfeb2gtAAAAAGjBVvxiLafc1ziPy-GMzeOVsNIg"></script>

    <script>
        (function () {
            const CLOUD_FUNCTION_URL = "https://us-central1-sfe-ai-chatbot.cloudfunctions.net/get_secure_file_url"
            const RECAPTCHA_SITE_KEY = "6Lfeb2gtAAAAAGjBVvxiLafc1ziPy-GMzeOVsNIg"

            function getRecaptchaToken(action, timeoutMs = 8000) {
                return new Promise((resolve, reject) => {
                    if (typeof grecaptcha === "undefined") {
                        return reject(new Error("grecaptcha not loaded"));
                    }
                    let resolved = false;
                    const to = setTimeout(() => {
                        if (resolved) return;
                        resolved = true;
                        reject(new Error("reCAPTCHA timeout"));
                    }, timeoutMs);

                    try {
                        grecaptcha.ready(() => {
                            grecaptcha.execute(RECAPTCHA_SITE_KEY, { action }).then(token => {
                                if (resolved) return;
                                resolved = true;
                                clearTimeout(to);
                                resolve(token);
                            }).catch(err => {
                                if (resolved) return;
                                resolved = true;
                                clearTimeout(to);
                                reject(err);
                            });
                        });
                    } catch (err) {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(to);
                            reject(err);
                        }
                    }
                });
            }

            async function requestFileAccess(filename) {
                try {
                    const token = await getRecaptchaToken("download", 8000);

                    const payload = { filename, recaptcha_token: token };
                    const resp = await fetch(CLOUD_FUNCTION_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });

                    if (!resp.ok) {
                        let errText = `Server returned ${resp.status}`;
                        try { const ej = await resp.json(); if (ej && ej.error) errText = ej.error; } catch (e) { }
                        alert("File access denied: " + errText);
                        return;
                    }

                    const json = await resp.json();
                    if (!json || !json.signed_url) {
                        alert("Invalid server response");
                        return;
                    }
                    window.open(json.signed_url, "_blank", "noopener,noreferrer");
                } catch (err) {
                    console.error("requestFileAccess error:", err);
                    alert("Unable to request file access: " + (err.message || err));
                }
            }

            window.requestGcsFileAccess = requestFileAccess;

            // Intercept clicks inside Dialogflow Messenger's Shadow DOM
            const dfMessenger = document.querySelector("df-messenger");
            if (dfMessenger) {
                dfMessenger.addEventListener("click", function (event) {
                    // Use composedPath to see through the shadow DOM boundary
                    const path = event.composedPath();
                    const target = path.find(el => el.tagName === "A");
                    if (!target) return;

                    const href = target.getAttribute("href");
                    if (!href) return;

                    if (href.includes("storage.cloud.google.com/sfe-brands-docs/") || href.includes("storage.googleapis.com/sfe-brands-docs/")) {
                        event.preventDefault();
                        event.stopPropagation();
                        try {
                            const urlObj = new URL(href);
                            let pathname = urlObj.pathname;

                            if (pathname.startsWith("/sfe-brands-docs/")) {
                                pathname = pathname.replace("/sfe-brands-docs/", "");
                            } else if (pathname.startsWith("/")) {
                                pathname = pathname.substring(1);
                            }

                            requestFileAccess(decodeURIComponent(pathname));
                        } catch (e) {
                            console.error("Error parsing source link path:", e);
                        }
                    }
                }, true); // Use capture phase to intercept before navigation
            }   
        })();
    </script>

</body>
</html>
